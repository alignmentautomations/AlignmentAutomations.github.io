  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />

  <style>
:root{
  --ink:#0b111e;--ink-2:#0f1829;--ink-3:#111d30;
  --line-dark:rgba(255,255,255,.08);
  --paper:#F7F8FB;--white:#fff;--line:#E4E8F0;
  --slate:#46536b;--slate-2:#6b7790;
  --blue:#3a7bfd;--blue-deep:#0066CC;--blue-light:#5aa3ff;--green:#34c98e;
  --display:'Inter',sans-serif;--mono:'JetBrains Mono',monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;overflow-x:clip}
body{font-family:var(--display);background:var(--ink);color:#fff;min-height:100vh;-webkit-font-smoothing:antialiased;line-height:1.55;
  background-image:radial-gradient(ellipse 70% 50% at 80% 0%,rgba(90,163,255,.12),transparent 60%),radial-gradient(ellipse 60% 50% at 10% 100%,rgba(58,123,253,.08),transparent 60%)}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px;border-radius:6px}
img,svg{max-width:100%}

/* Nav */
.nav{position:sticky;top:0;z-index:50;background:rgba(11,18,32,.85);backdrop-filter:blur(14px);border-bottom:1px solid var(--line-dark)}
.nav-in{display:flex;align-items:center;justify-content:space-between;height:64px;max-width:1080px;margin:0 auto;padding:0 22px}
.logo{display:flex;align-items:center;gap:10px;color:#fff;font-weight:700;font-size:16px;letter-spacing:-.01em}
.logo-img{height:34px;width:auto;flex:none}
.nav-exit{font-family:var(--mono);font-size:12px;color:#8b96ae;letter-spacing:.04em}
.nav-exit:hover{color:#fff}

.wrap{max-width:1080px;margin:0 auto;padding:0 22px}
.stage{padding:30px 0 70px}

/* Eyebrow / heads */
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:600;color:var(--blue-light);display:flex;align-items:center;gap:9px;justify-content:center;margin-bottom:14px}
.eyebrow::before,.eyebrow::after{content:"";width:18px;height:2px;background:var(--blue);display:inline-block}

/* Progress bar */
.progress{display:flex;align-items:center;justify-content:center;max-width:540px;margin:8px auto 30px}
.pstep{display:flex;flex-direction:column;align-items:center;gap:6px;flex-shrink:0}
.pdot{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.12);color:#8b96ae;transition:all .3s}
.pstep.active .pdot{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 0 0 4px rgba(58,123,253,.2)}
.pstep.done .pdot{background:rgba(52,201,142,.16);border-color:var(--green);color:var(--green)}
.pstep span{font-family:var(--mono);font-size:9.5px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:#8b96ae;white-space:nowrap}
.pstep.active span{color:var(--blue-light)}.pstep.done span{color:var(--green)}
.pline{flex:1;height:2px;min-width:18px;background:rgba(255,255,255,.08);margin-bottom:20px}
.pline.done{background:rgba(52,201,142,.3)}
@media(max-width:560px){.pstep span{display:none}}

/* Scene */
.scene{animation:fade .45s ease}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.scene-head{text-align:center;max-width:640px;margin:0 auto 30px}
.scene-head h1{font-size:clamp(24px,3.4vw,34px);font-weight:800;letter-spacing:-.02em;line-height:1.12;margin-bottom:10px}
.scene-head .tstamp{display:inline-block;font-family:var(--mono);font-size:11px;color:var(--green);background:rgba(52,201,142,.1);border:1px solid rgba(52,201,142,.26);border-radius:99px;padding:3px 11px;margin-bottom:14px}
.scene-head p{color:#aab4c8;font-size:16px;line-height:1.6}

/* Phones row */
.phones{display:flex;gap:30px;justify-content:center;align-items:flex-start;flex-wrap:wrap;margin-bottom:14px}
.phone-wrap{display:flex;flex-direction:column;align-items:center;gap:12px}
.phone-label{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:#8b96ae;display:flex;align-items:center;gap:7px}
.phone-label.cust{color:var(--blue-light)}
.phone-label.you{color:var(--green)}

/* Phone frame */
.phone{width:286px;max-width:88vw;background:#05080f;border:11px solid #161d2b;border-radius:42px;box-shadow:0 30px 70px rgba(0,0,0,.55),inset 0 0 0 1px rgba(255,255,255,.04);overflow:hidden;position:relative}
.phone .screen{min-height:520px;display:flex;flex-direction:column;position:relative}
.sbar{display:flex;justify-content:space-between;align-items:center;padding:11px 22px 7px;font-size:12px;font-weight:700;flex:none}
.sbar .ico{display:flex;gap:5px;align-items:center;font-size:10px;opacity:.9}

/* Light (customer) screen */
.screen.light{background:#f2f3f5;color:#111}
.screen.light .sbar{color:#111}
/* Dark (business) screen */
.screen.dark{background:linear-gradient(180deg,#0a1830,#0a0f1c);color:#fff}
.screen.dark .sbar{color:#fff}

/* Messages app header */
.msg-head{background:#fafafa;border-bottom:1px solid #e3e3e6;padding:8px 14px 12px;display:flex;flex-direction:column;align-items:center;gap:6px;flex:none}
.msg-head .av{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,#5aa3ff,#3a7bfd);display:grid;place-items:center}
.msg-head .av svg{width:26px;height:26px}
.msg-head .nm{font-size:12.5px;font-weight:700;color:#111}
.msg-thread{flex:1;padding:16px 13px;display:flex;flex-direction:column;gap:9px;overflow:hidden}
.msg-time{text-align:center;font-size:10px;color:#8a8a8e;margin-bottom:2px}
.bub{max-width:80%;padding:9px 13px;border-radius:18px;font-size:12.5px;line-height:1.4;word-wrap:break-word}
.bub.in{background:#e5e5ea;color:#111;align-self:flex-start;border-bottom-left-radius:5px}
.bub.out{background:linear-gradient(180deg,#3a8bfd,#2f7bf6);color:#fff;align-self:flex-end;border-bottom-right-radius:5px}
.bub .lnk{color:inherit;text-decoration:underline;font-weight:600}
.bub.out.cta{background:#fff;color:#1163d6;border:1px solid #cfe0ff;font-weight:700;align-self:flex-end;text-align:center}
.delivered{align-self:flex-end;font-size:9.5px;color:#8a8a8e;margin-top:-4px}
.bub.typing{align-self:flex-start;display:inline-flex;gap:5px;align-items:center;padding:13px 15px;background:#e5e5ea;border-radius:18px;border-bottom-left-radius:5px}
.bub.typing span{width:7px;height:7px;border-radius:50%;background:#9a9aa0;display:inline-block;animation:typedot 1.3s infinite ease-in-out}
.bub.typing span:nth-child(2){animation-delay:.18s}
.bub.typing span:nth-child(3){animation-delay:.36s}
@keyframes typedot{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-4px)}}
.reveal{display:none}
.reveal.show{display:block;animation:bubpop .25s ease}
@keyframes bubpop{from{opacity:0;transform:translateY(6px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}

/* Call screen */
.call{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:30px 20px;background:linear-gradient(180deg,#11203a,#0a0f1c)}
.call .who{font-size:20px;font-weight:700}
.call .sub{font-size:12px;color:#9fb0c8;font-family:var(--mono)}
.call .ring{width:90px;height:90px;border-radius:50%;background:rgba(58,123,253,.14);border:1px solid rgba(58,123,253,.4);display:grid;place-items:center;margin-bottom:6px}
.call .ring.missed{background:rgba(239,68,68,.14);border-color:rgba(239,68,68,.5)}
.call .actions{display:flex;gap:30px;margin-top:18px}
.call .ab{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-size:22px}
.call .ab.red{background:#e5484d}.call .ab.green{background:#34c98e}
.call .missed-tag{font-family:var(--mono);font-size:11px;color:#ff8a8a;background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.3);border-radius:99px;padding:3px 11px}

/* Lock screen / notifications */
.lock{flex:1;display:flex;flex-direction:column;padding:26px 16px 18px}
.lock .clock{text-align:center;margin-bottom:20px}
.lock .clock .t{font-size:46px;font-weight:300;line-height:1;letter-spacing:-.02em}
.lock .clock .d{font-size:12px;color:#aab4c8;margin-top:4px}
.notif{background:rgba(255,255,255,.1);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:11px 13px;display:flex;gap:10px;margin-bottom:9px;animation:pop .4s ease}
@keyframes pop{from{opacity:0;transform:scale(.95) translateY(6px)}to{opacity:1;transform:scale(1) translateY(0)}}
.notif .nic{width:30px;height:30px;border-radius:8px;flex:none;display:grid;place-items:center;font-size:15px}
.notif .nic.aa{background:linear-gradient(135deg,#5aa3ff,#3a7bfd)}
.notif .nic.aa svg{width:18px;height:18px}
.notif .nic.phone{background:#34c98e}
.notif .nic.cal{background:#e5484d}
.notif .nbody{flex:1;min-width:0}
.notif .nrow{display:flex;justify-content:space-between;gap:8px}
.notif .ntitle{font-size:11.5px;font-weight:700}
.notif .nwhen{font-size:10px;color:#aab4c8;flex:none}
.notif .ntext{font-size:11.5px;color:#dbe2ee;line-height:1.4;margin-top:1px}

/* Lead card (your side app) */
.app-head{background:rgba(255,255,255,.04);border-bottom:1px solid var(--line-dark);padding:13px 16px;display:flex;align-items:center;gap:9px;flex:none}
.app-head .av{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,#5aa3ff,#3a7bfd);display:grid;place-items:center}
.app-head .av svg{width:15px;height:15px}
.app-head .nm{font-size:12px;font-weight:700}
.app-head .nm small{display:block;font-size:9.5px;color:#8b96ae;font-weight:500;font-family:var(--mono)}
.lead{padding:16px;flex:1}
.lead .badge{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--green);background:rgba(52,201,142,.12);border:1px solid rgba(52,201,142,.28);border-radius:99px;padding:4px 10px;margin-bottom:14px}
.lead .badge .liv{width:6px;height:6px;border-radius:50%;background:var(--green);display:inline-block}
.lead-row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line-dark);font-size:12.5px}
.lead-row:last-child{border-bottom:none}
.lead-row .k{color:#8b96ae;font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;padding-top:1px}
.lead-row .v{color:#fff;font-weight:600;text-align:right}
.lead-foot{margin-top:14px;background:rgba(52,201,142,.08);border:1px solid rgba(52,201,142,.2);border-radius:10px;padding:10px 12px;font-size:11.5px;color:#bfe9d4;display:flex;gap:8px;align-items:center}

/* Booking confirm screen */
.book{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:28px 22px;text-align:center;background:#f2f3f5;color:#111}
.book .chk{width:62px;height:62px;border-radius:50%;background:rgba(52,201,142,.15);border:2px solid var(--green);display:grid;place-items:center;font-size:30px;margin-bottom:6px}
.book h4{font-size:17px;font-weight:800;color:#111}
.book .date{background:#fff;border:1px solid #e3e3e6;border-radius:12px;padding:12px 16px;margin-top:8px;width:100%}
.book .date .d{font-size:15px;font-weight:800;color:#111}
.book .date .s{font-size:12px;color:#5a5a5e;margin-top:2px}
.book .biz{font-size:11.5px;color:#5a5a5e;font-family:var(--mono);margin-top:4px}

/* Form screen */
.formv{flex:1;background:#f2f3f5;color:#111;padding:16px;display:flex;flex-direction:column}
.formv .url{background:#fff;border:1px solid #e3e3e6;border-radius:99px;padding:7px 13px;font-size:11px;color:#5a5a5e;font-family:var(--mono);text-align:center;margin-bottom:14px}
.formv h4{font-size:15px;font-weight:800;color:#111;margin-bottom:3px}
.formv .lede{font-size:11.5px;color:#5a5a5e;margin-bottom:14px}
.ff{margin-bottom:9px}
.ff label{display:block;font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#8a8a8e;margin-bottom:4px;font-family:var(--mono)}
.ff .inp{background:#fff;border:1px solid #d9d9de;border-radius:9px;padding:9px 11px;font-size:12.5px;color:#111}
.ff .inp.filled{border-color:#3a7bfd;box-shadow:0 0 0 3px rgba(58,123,253,.12)}
.fbtn{margin-top:6px;background:linear-gradient(180deg,#3a8bfd,#2f7bf6);color:#fff;border-radius:10px;padding:11px;text-align:center;font-size:13px;font-weight:700}

/* Narrate (single phone layouts) */
.solo{display:grid;grid-template-columns:286px 1fr;gap:40px;align-items:center;max-width:820px;margin:0 auto;justify-content:center}
.solo .narrate{font-size:15px;color:#aab4c8;line-height:1.65}
.solo .narrate .pt{display:flex;gap:11px;margin-bottom:14px}
.solo .narrate .pt .pn{width:24px;height:24px;border-radius:50%;flex:none;background:rgba(58,123,253,.14);border:1px solid rgba(58,123,253,.3);color:var(--blue-light);font-size:11px;font-weight:800;display:grid;place-items:center;font-family:var(--mono)}
.solo .narrate .pt strong{color:#fff;font-weight:600}
@media(max-width:760px){.solo{grid-template-columns:1fr;gap:26px}.solo .phone-wrap{justify-self:center}}

/* Choice (intro) */
.choice{display:grid;grid-template-columns:1fr 1fr;gap:18px;max-width:720px;margin:0 auto 8px}
.ccard{background:rgba(255,255,255,.04);border:1px solid var(--line-dark);border-radius:16px;padding:30px 26px;cursor:pointer;text-align:left;transition:transform .18s,border-color .18s,background .18s;color:#fff}
.ccard:hover{transform:translateY(-4px);border-color:rgba(58,123,253,.5);background:rgba(58,123,253,.06)}
.ccard .ci{width:50px;height:50px;border-radius:13px;background:rgba(58,123,253,.14);border:1px solid rgba(58,123,253,.3);display:grid;place-items:center;margin-bottom:16px}
.ccard h3{font-size:18px;font-weight:700;margin-bottom:7px}
.ccard p{font-size:14px;color:#aab4c8;line-height:1.5}
.ccard .go{margin-top:16px;font-family:var(--mono);font-size:12px;color:var(--blue-light);font-weight:600}
.biz-field{max-width:420px;margin:0 auto 30px;text-align:center}
.biz-field label{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#8b96ae;margin-bottom:9px}
.biz-field input{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--line-dark);border-radius:11px;padding:12px 15px;font-family:var(--display);font-size:15px;color:#fff;text-align:center;outline:none}
.biz-field input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(58,123,253,.25)}
@media(max-width:600px){.choice{grid-template-columns:1fr}}

/* Recap */
.recap{max-width:680px;margin:0 auto}
.recap-card{background:rgba(255,255,255,.03);border:1px solid var(--line-dark);border-radius:16px;padding:26px}
.rstep{display:flex;gap:14px;padding:13px 0;border-bottom:1px solid var(--line-dark)}
.rstep:last-child{border-bottom:none}
.rdot{width:30px;height:30px;border-radius:50%;flex:none;background:rgba(52,201,142,.14);border:2px solid var(--green);color:var(--green);font-size:12px;font-weight:800;display:grid;place-items:center;margin-top:1px}
.rstep .rc strong{display:block;font-size:14.5px;color:#fff}
.rstep .rc span{font-size:13px;color:#aab4c8}
.rstep .rt{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--green);flex:none;padding-top:3px}
.recap-punch{text-align:center;margin:26px 0 28px}
.recap-punch h2{font-size:clamp(22px,3vw,30px);font-weight:800;letter-spacing:-.02em}
.recap-punch h2 em{font-style:normal;color:var(--green)}
.recap-punch p{color:#aab4c8;margin-top:8px;font-size:15px}

/* Buttons + controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:var(--display);font-weight:700;font-size:15px;border-radius:11px;padding:13px 24px;cursor:pointer;border:none;transition:transform .15s,box-shadow .15s,background .15s;white-space:nowrap}
.btn-blue{background:var(--blue);color:#fff;box-shadow:0 6px 22px rgba(58,123,253,.38)}
.btn-blue:hover{background:#5089ff;transform:translateY(-1px)}
.btn-ghost{background:rgba(255,255,255,.06);color:#fff;border:1px solid rgba(255,255,255,.18)}
.btn-ghost:hover{border-color:rgba(255,255,255,.4)}
.btn-green{background:linear-gradient(180deg,#34c98e,#1f9d6b);color:#06231a;box-shadow:0 6px 22px rgba(52,201,142,.3)}
.btn-green:hover{transform:translateY(-1px)}
.controls{display:flex;gap:12px;justify-content:center;align-items:center;margin-top:38px;flex-wrap:wrap}
.controls .back{font-family:var(--mono);font-size:13px;color:#8b96ae;cursor:pointer;background:none;border:none;padding:10px}
.controls .back:hover{color:#fff}
.cta-row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:6px}
.fineprint{text-align:center;font-family:var(--mono);font-size:11px;color:#5b6680;margin-top:22px;letter-spacing:.03em}

@media(prefers-reduced-motion:reduce){*{animation-duration:.001s!important}}
  </style>
</head>

<nav class="nav" aria-label="Main">

<!-- inline brand mark for avatars -->
<template id="aaMark"><svg viewBox="-140 -140 280 280" xmlns="http://www.w3.org/2000/svg"><polygon points="0,-120 104,-60 104,60 0,120 -104,60 -104,-60" fill="none"/><rect x="-5" y="-70" width="10" height="140" rx="5" fill="#fff"/><circle cx="0" cy="0" r="26" fill="#fff"/><path d="M -10 0 L -2 8 L 14 -10" stroke="#3a7bfd" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></template>

<script>
const AA = '<svg viewBox="-140 -140 280 280"><rect x="-5" y="-70" width="10" height="140" rx="5" fill="#fff"/><circle cx="0" cy="0" r="26" fill="#fff"/><path d="M -10 0 L -2 8 L 14 -10" stroke="#3a7bfd" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';

const state = { biz: 'Your Business', path: null, i: 0, flow: [] };

// sample customer
const cust = { name: 'Jamie Rivera', first: 'Jamie', phone: '(555) 482-1190', reason: 'a free estimate' };

// booking date: +2 business days, 9–10am
function bookDate(){
  let d = new Date(); let c = 0;
  while(c<2){ d.setDate(d.getDate()+1); const g=d.getDay(); if(g!==0&&g!==6) c++; }
  const days=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const mon=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${days[d.getDay()]}, ${mon[d.getMonth()]} ${d.getDate()}`;
}
const BDATE = bookDate();
const sbar = (light)=>`<div class="sbar"><span>9:41</span><span class="ico">●●● &nbsp;5G &nbsp;100%</span></div>`;
const biz = ()=> state.biz && state.biz.trim() ? state.biz.trim() : 'Your Business';

/* ---- step renderers: each returns {stage, head, body, soloNarr} ---- */
const STEPS = {
  call(){return{stage:0,
    head:{t:'You miss the call — because you’re on the job.',ts:'the moment it happens',p:`A homeowner calls while you’re up a ladder. You can’t answer. Normally, that lead just calls the next contractor on the list.`},
    phones:[
      {label:['cust','📞 Their phone'],screen:'dark',inner:`<div class="call"><div class="ring"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#5aa3ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72c.13.96.36 1.9.7 2.81a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0122 16.92z"/></svg></div><div class="who">${biz()}</div><div class="sub">calling…</div><div class="actions"><div class="ab red">✖</div><div class="ab green">↗</div></div></div>`},
      {label:['you','🔧 Your phone'],screen:'dark',inner:`<div class="call"><div class="ring missed"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#ff8a8a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72c.13.96.36 1.9.7 2.81a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0122 16.92z"/></svg></div><div class="who">${cust.name}</div><div class="sub">${cust.phone}</div><div class="missed-tag" style="margin-top:10px">Missed call · just now</div></div>`}
    ]};
  },
  form(){return{stage:0,
    head:{t:'A lead fills out your site — even at 9pm.',ts:'the moment it happens',p:`${cust.name} finds your website after hours and asks for a quote. No phone call, no waiting for business hours.`},
    solo:{screen:'light',inner:`<div class="formv"><div class="url">🔒 ${biz().toLowerCase().replace(/[^a-z0-9]+/g,'')}.com</div><h4>Request a Free Estimate</h4><div class="lede">Tell us what you need — we’ll be right back to you.</div><div class="ff"><label>Name</label><div class="inp filled">${cust.name}</div></div><div class="ff"><label>Phone</label><div class="inp filled">${cust.phone}</div></div><div class="ff"><label>What do you need?</label><div class="inp filled">Looking for ${cust.reason} on a project at my place</div></div><div class="fbtn">Send Request →</div></div>`},
    narr:[['1',`<strong>They hit submit.</strong> That’s the only thing that has to happen.`],['2',`No app for them to download, no account to make — just a simple request from your site.`],['3',`The instant it’s sent, your system takes over. Watch what happens next.`]]};
  },
  text(){return{stage:1,
    head:{t:'Within seconds, your system texts them back.',ts:'+ 8 seconds · automatic',p:`Before they can look up another contractor, ${cust.first} gets a friendly text from your business — with a link to book.`},
    solo:{screen:'light',inner:`<div class="msg-head"><div class="av">${AA}</div><div class="nm">${biz()}</div></div><div class="msg-thread"><div class="msg-time">Text Message · now</div><div class="bub in reveal">Hi, this is ${biz()} 👋 Sorry we missed your call — we’re out on a job right now.</div><div class="bub in reveal">Want ${cust.reason}? Grab a time that works for you here: <span class="lnk">book.${biz().toLowerCase().replace(/[^a-z0-9]+/g,'')}.com</span></div><div class="bub typing" id="smsTyping"><span></span><span></span><span></span></div><div class="delivered reveal">Delivered</div></div>`},
    narr:[['1',`<strong>You didn’t send this.</strong> Your system did — in about 8 seconds.`],['2',`A text gets read in minutes. A voicemail usually doesn’t. This is how you win the job before a competitor calls back.`],['3',`Next: what landed on <strong>your</strong> phone at the same moment.`]]};
  },
  confirm(){return{stage:1,
    head:{t:'They get an instant reply with a booking link.',ts:'+ 8 seconds · automatic',p:`${cust.first} immediately knows you got the request — and exactly how to lock in a time.`},
    solo:{screen:'light',inner:`<div class="msg-head"><div class="av">${AA}</div><div class="nm">${biz()} · Email</div></div><div class="msg-thread"><div class="msg-time">Inbox · now</div><div class="bub in" style="max-width:92%">Hi ${cust.first}, thanks for reaching out to ${biz()}! We’ve got your request for ${cust.reason} and we’ll be in touch shortly.</div><div class="bub in" style="max-width:92%">Want to lock it in now? Pick a time that works for you:</div><div class="bub out cta">📅 Book my free estimate →</div><div class="delivered">Delivered · now</div></div>`},
    narr:[['1',`<strong>Automatic.</strong> The confirmation and booking link go out the instant they submit.`],['2',`No "we’ll call you back." They get a clear next step while they’re still interested.`],['3',`Next: what landed on <strong>your</strong> phone at the same moment.`]]};
  },
  logged(){const src = state.path==='call' ? 'Missed call' : 'Website form';
    return{stage:1,
    head:{t:'Here’s your side — the lead is already captured.',ts:'+ 8 seconds · automatic',p:`At the same moment, your phone buzzes. The lead’s details are logged for you — nothing to write down, nothing to remember.`},
    phones:[
      {label:['you','🔔 Your phone — notifications'],screen:'dark',inner:`<div class="lock"><div class="clock"><div class="t">9:41</div><div class="d">${BDATE.split(',')[0]}</div></div><div class="notif"><div class="nic aa">${AA}</div><div class="nbody"><div class="nrow"><span class="ntitle">${biz()} · New Lead</span><span class="nwhen">now</span></div><div class="ntext">${cust.name} — ${cust.phone}. Wants ${cust.reason}. Logged ✅</div></div></div>${state.path==='call'?`<div class="notif"><div class="nic phone">📞</div><div class="nbody"><div class="nrow"><span class="ntitle">Auto text-back sent</span><span class="nwhen">now</span></div><div class="ntext">Replied to ${cust.first} before they called anyone else.</div></div></div>`:`<div class="notif"><div class="nic phone">✉️</div><div class="nbody"><div class="nrow"><span class="ntitle">Auto-reply sent</span><span class="nwhen">now</span></div><div class="ntext">Confirmation + booking link delivered to ${cust.first}.</div></div></div>`}</div>`},
      {label:['you','📋 In your lead list'],screen:'dark',inner:`<div class="app-head"><div class="av">${AA}</div><div class="nm">${biz()}<small>Leads</small></div></div><div class="lead"><span class="badge"><span class="liv"></span> New · captured</span><div class="lead-row"><span class="k">Name</span><span class="v">${cust.name}</span></div><div class="lead-row"><span class="k">Phone</span><span class="v">${cust.phone}</span></div><div class="lead-row"><span class="k">Wants</span><span class="v">${cust.reason}</span></div><div class="lead-row"><span class="k">Source</span><span class="v">${src}</span></div><div class="lead-row"><span class="k">Status</span><span class="v" style="color:var(--green)">Replied ✓</span></div><div class="lead-foot">✅ Captured &amp; logged automatically — you did nothing.</div></div>`}
    ]};
  },
  booked(){return{stage:2,
    head:{t:`${cust.first} books — it lands on your calendar.`,ts:'+ a few minutes',p:`They tap the link and pick a time. The estimate is confirmed for both of you, and it’s added to your calendar automatically.`},
    phones:[
      {label:['cust','📱 Their phone'],screen:'light',inner:`<div class="book"><div class="chk">🎉</div><h4>You’re booked!</h4><div class="date"><div class="d">${BDATE}</div><div class="s">9:00 – 10:00 AM · Free estimate</div></div><div class="biz">with ${biz()}</div></div>`},
      {label:['you','📅 Your phone'],screen:'dark',inner:`<div class="lock"><div class="clock"><div class="t">9:43</div><div class="d">${BDATE.split(',')[0]}</div></div><div class="notif"><div class="nic cal">📅</div><div class="nbody"><div class="nrow"><span class="ntitle">New booking</span><span class="nwhen">now</span></div><div class="ntext">${cust.name} booked a free estimate — ${BDATE}, 9:00 AM. Added to your calendar.</div></div></div><div class="notif"><div class="nic aa">${AA}</div><div class="nbody"><div class="nrow"><span class="ntitle">${biz()}</span><span class="nwhen">now</span></div><div class="ntext">Reminder scheduled for ${cust.first} the day before. ✅</div></div></div></div>`}
    ]};
  },
  recap(){const src = state.path==='call' ? 'Missed your call' : 'Filled out your site';
    return{stage:3,recap:true,
    head:null,
    recapData:[
      ['1',src,state.path==='call'?`${cust.name} called while you were on the job.`:`${cust.name} asked for a quote at 9pm.`,'T + 0:00'],
      ['2',state.path==='call'?'Instant text-back sent':'Instant reply sent',`A friendly message + booking link went out automatically.`,'T + 0:08'],
      ['3','Lead captured &amp; you were notified',`Name, number, and request logged — nothing for you to do.`,'T + 0:08'],
      ['4','Estimate booked',`${cust.first} picked a time. It synced to your calendar.`,'T + 4 min']
    ]};
  }
};

function buildFlow(){
  state.flow = state.path==='call'
    ? ['call','text','logged','booked','recap']
    : ['form','confirm','logged','booked','recap'];
}

const STAGES = ['Lead in','Instant reply','Booked','Done'];
function renderProgress(stage){
  const p = document.getElementById('progress');
  p.hidden = false;
  let h='';
  STAGES.forEach((s,idx)=>{
    const cls = idx<stage?'done':(idx===stage?'active':'');
    h += `<div class="pstep ${cls}"><div class="pdot">${idx<stage?'✓':(idx+1)}</div><span>${s}</span></div>`;
    if(idx<STAGES.length-1) h+=`<div class="pline ${idx<stage?'done':''}"></div>`;
  });
  p.innerHTML = h;
}

function phoneHTML(p){
  return `<div class="phone-wrap"><div class="phone-label ${p.label[0]}">${p.label[1]}</div><div class="phone"><div class="screen ${p.screen}">${sbar()}${p.inner}</div></div></div>`;
}

function renderIntro(){
  document.getElementById('progress').hidden = true;
  document.getElementById('scene').innerHTML = `
    <div class="scene-head">
      <div class="eyebrow">Live demo</div>
      <h1>Step into your business for 60 seconds.</h1>
      <p>See exactly what happens when a new lead comes in — from your customer’s phone <em>and</em> your own. Pick how the lead reaches you to start.</p>
    </div>
    <div class="biz-field">
      <label>Your business name (optional — makes it feel real)</label>
      <input id="bizInput" type="text" placeholder="e.g. Apex Home Services" maxlength="32" value="${state.biz==='Your Business'?'':state.biz}">
    </div>
    <div class="choice">
      <button class="ccard" onclick="start('call')">
        <div class="ci"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#5aa3ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72c.13.96.36 1.9.7 2.81a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0122 16.92z"/></svg></div>
        <h3>They call &amp; you miss it</h3>
        <p>You’re on a job and can’t pick up. See how the missed call turns into a booked estimate anyway.</p>
        <div class="go">Start this path →</div>
      </button>
      <button class="ccard" onclick="start('form')">
        <div class="ci"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#5aa3ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v14H4z"/><path d="M8 10h8M8 14h5"/></svg></div>
        <h3>They fill out your site</h3>
        <p>An online quote request comes in after hours. See it get answered and booked — automatically.</p>
        <div class="go">Start this path →</div>
      </button>
    </div>`;
  document.getElementById('controls').innerHTML = '';
}

function start(path){
  const inp = document.getElementById('bizInput');
  if(inp && inp.value.trim()) state.biz = inp.value.trim();
  state.path = path; state.i = 0; buildFlow();
  render();
}

function render(){
  const key = state.flow[state.i];
  const step = STEPS[key]();
  renderProgress(step.stage);
  const scene = document.getElementById('scene');

  let html = '';
  if(step.recap){
    const c = cust;
    html += `<div class="scene-head"><div class="eyebrow">That’s the whole flow</div></div><div class="recap"><div class="recap-card">`;
    step.recapData.forEach(r=>{ html += `<div class="rstep"><div class="rdot">${r[0]}</div><div class="rc"><strong>${r[1]}</strong><span>${r[2]}</span></div><div class="rt">${r[3]}</div></div>`; });
    html += `</div><div class="recap-punch"><h2>Your total effort: <em>none.</em></h2><p>From first contact to a booked job on your calendar — all automatic, while you stayed on the job. This is what we set up and run for you.</p></div></div>`;
  } else {
    html += `<div class="scene-head">${step.head.ts?`<div class="tstamp">${step.head.ts}</div><br>`:''}<h1>${step.head.t}</h1><p>${step.head.p}</p></div>`;
    if(step.phones){
      html += `<div class="phones">${step.phones.map(phoneHTML).join('')}</div>`;
    } else if(step.solo){
      html += `<div class="solo">${phoneHTML({label:step.solo.label||['cust','📱 Their phone'],screen:step.solo.screen,inner:step.solo.inner})}<div class="narrate">${(step.narr||[]).map(n=>`<div class="pt"><div class="pn">${n[0]}</div><div>${n[1]}</div></div>`).join('')}</div></div>`;
    }
  }
  scene.innerHTML = html;
  scene.classList.remove('scene'); void scene.offsetWidth; scene.classList.add('scene');
  if(key==='text') playSMS();

  // controls
  const last = state.i === state.flow.length-1;
  const ctr = document.getElementById('controls');
  if(step.recap){
    ctr.innerHTML = `<div class="controls" style="flex-direction:column;gap:18px"><div class="cta-row"><a class="btn btn-green" href="contact.html">Book a real demo for my business</a><a class="btn btn-ghost" href="/pricing.html">See pricing</a></div><button class="back" onclick="replay()">↺ Watch the other path</button></div>`;
  } else {
    ctr.innerHTML = `<div class="controls"><button class="back" onclick="goBack()">← Back</button><button class="btn btn-blue" onclick="goNext()">Continue →</button></div>`;
  }
  window.scrollTo({top:0,behavior:'smooth'});
}

function playSMS(){
  const typing = document.getElementById('smsTyping');
  const reveals = [...document.querySelectorAll('#scene .reveal')];
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduce){ reveals.forEach(r=>r.classList.add('show')); if(typing) typing.style.display='none'; return; }
  if(typing) typing.style.display='inline-flex';
  let t = 1000;
  reveals.forEach(el=>{
    const isDelivered = el.classList.contains('delivered');
    setTimeout(()=>{ el.classList.add('show'); if(isDelivered && typing) typing.style.display='none'; }, t);
    t += isDelivered ? 300 : 850;
  });
}
function goNext(){ if(state.i < state.flow.length-1){ state.i++; render(); } }
function goBack(){ if(state.i > 0){ state.i--; render(); } else { renderIntro(); } }
function replay(){ state.path=null; renderIntro(); window.scrollTo({top:0,behavior:'smooth'}); }

renderIntro();
</script>
</body>
</html>
